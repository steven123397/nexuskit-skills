name: checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  run-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/run_checks.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check wizard template syntax
        shell: bash
        run: bash -n skills/nk-wizard/assets/template.sh
